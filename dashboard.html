function daysSince(ts){return ts?Math.floor((Date.now()-ts)/864e5):null}
function flags(l){
  var f=[];
  S.cfg.assessments.forEach(function(t){if(testRes(l,t)==="refer")f.push("Referred: "+t.title)});
  var d=l.hub&&l.hub.lastActive?daysSince(l.hub.lastActive):null;

  var tests=S.cfg.assessments.filter(function(t){return testRes(l,t)!==null});

  return{ud:ud,up:up,ad:ad,at:actList().length,tests:tests.length,pass:pass};
}

/* ---------- writes ---------- */
function write(key,fn){
  var p=(queue[key]||Promise.resolve()).then(fn).catch(function(e){
    console.error("WRITE ERROR:", e);
    toast(errMsg(e),true);
  });
  queue[key]=p;
  return p;
}

function upd(id,data){

  return write("l"+id, async function(){

    const payload = Object.assign(
      {},
      data,
      { updated: Date.now() }
    );

    if (payload.group !== undefined) {
      payload.learner_group = payload.group;
      delete payload.group;
    }

    const { error } = await sb
      .from("learners")
      .update(payload)
      .eq("id", id);

    if (error) {
      console.error(error);
      throw error;
    }
    console.log("UPDATE SUCCESS", payload);
    return true;
  });

}
function saveCfg(next){S.cfg=next;render();return write("cfg",function(){return DB.doc("config/main").set(next)})}
function plan(rows){
  var have={};S.learners.forEach(function(l){have[l.name.toLowerCase()]=l});
  var seen={},fresh=[],upd=[],dup=0;
  rows.forEach(function(r){
    var name=String(r.name||"").replace(/\s+/g," ").trim().slice(0,80);if(!name)return;
    var k=name.toLowerCase();if(seen[k]){dup++;return}seen[k]=1;
    var g=String(r.group||"").trim().slice(0,40),cur=have[k];
    if(!cur)fresh.push({name:name,group:g});
    else if(g&&g!==cur.group)upd.push({id:cur.id,group:g});
    else dup++;
  });
  return{fresh:fresh,upd:upd,dup:dup};
}
async function applyPlan(pl){

  var jobs = pl.fresh.map(function(r){
    return async function(){

      const { error } = await sb
        .from("learners")
        .insert([
          {
            id: uid(),
            name: r.name,
            learner_group: r.group,
            units: {},
            acts: {},
            tests: {},
            notes: [],
            target: "",
            created: Date.now(),
            updated: Date.now()
          }
        ]);

      if(error){
        console.error(error);
        throw error;
      }
    };
  })

  .concat(

    pl.upd.map(function(r){
      return async function(){

        const { error } = await sb
          .from("learners")
          .update({
            learner_group: r.group,
            updated: Date.now()
          })
          .eq("id", r.id);

        if(error){
          console.error(error);
          throw error;
        }
      };
    })

  );

  var i=0,failed=0;

  async function worker(){
    while(i<jobs.length){
      var j=jobs[i++];

      try{
        await j();
      }catch(e){
        console.error(e);
        failed++;
      }
    }
  }

  S.busy=true;
  render();

  await Promise.all([
    worker(),
    worker(),
    worker(),
    worker()
  ]);

  S.busy=false;
  render();

  return failed;
}
async function inflate(u8,method){
  if(method===0)return u8;
  if(method!==8||typeof DecompressionStream==="undefined")throw new Error("unsupported");
  var ds=new DecompressionStream("deflate-raw"),w=ds.writable.getWriter();w.write(u8);w.close();
  return new Uint8Array(await new Response(ds.readable).arrayBuffer());
}
async function readXlsx(buf){
  var dv=new DataView(buf),u8=new Uint8Array(buf),dec=new TextDecoder(),e=-1;
  for(var i=u8.length-22;i>=Math.max(0,u8.length-70000);i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break}
  if(e<0)throw new Error("not a zip");
  var cnt=dv.getUint16(e+10,true),off=dv.getUint32(e+16,true),files={};
  for(var k=0;k<cnt;k++){
    if(dv.getUint32(off,true)!==0x02014b50)break;
    var nl=dv.getUint16(off+28,true),xl=dv.getUint16(off+30,true),cl=dv.getUint16(off+32,true);
    files[dec.decode(u8.subarray(off+46,off+46+nl))]={m:dv.getUint16(off+10,true),c:dv.getUint32(off+20,true),o:dv.getUint32(off+42,true)};
    off+=46+nl+xl+cl;
  }
  var get=async function(name){var f=files[name];if(!f)return null;var o=f.o,n2=dv.getUint16(o+26,true),x2=dv.getUint16(o+28,true),st=o+30+n2+x2;return dec.decode(await inflate(u8.subarray(st,st+f.c),f.m))};
  var sheetName=files["xl/worksheets/sheet1.xml"]?"xl/worksheets/sheet1.xml":Object.keys(files).filter(function(n){return /^xl\/worksheets\/sheet\d+\.xml$/.test(n)}).sort()[0];
  if(!sheetName)throw new Error("no sheet");
  var P=new DOMParser(),shared=[],ss=await get("xl/sharedStrings.xml");
  if(ss){var sd=P.parseFromString(ss,"application/xml");Array.prototype.forEach.call(sd.getElementsByTagName("si"),function(si){shared.push(Array.prototype.map.call(si.getElementsByTagName("t"),function(t){return t.textContent}).join(""))})}
  var doc=P.parseFromString(await get(sheetName),"application/xml"),rows=[];
  Array.prototype.forEach.call(doc.getElementsByTagName("row"),function(row){
    var r=[];
    Array.prototype.forEach.call(row.getElementsByTagName("c"),function(c){
      var ref=c.getAttribute("r")||"",m=/^([A-Z]+)/.exec(ref),ci=0;
      if(m){for(var q=0;q<m[1].length;q++)ci=ci*26+m[1].charCodeAt(q)-64;ci--}else ci=r.length;

function readSheet(file){
  if(file.size>5e6){toast("That file is too large.",true);return}
  if(/\.xls$/i.test(file.name)){toast("Older .xls files are not supported. In Excel choose Save As and pick Excel Workbook (.xlsx), then upload that.",true);return}
  var fr=new FileReader();
  fr.onload=async function(){
    try{
      var rows=/\.csv$/i.test(file.name)||file.type==="text/csv"?parseCsv(new TextDecoder().decode(new Uint8Array(fr.result))):await readXlsx(fr.result);
      rows=rows.slice(0,2000).filter(function(r){return r.some(function(c){return String(c).trim()!==""})});
      if(!rows.length){toast("That spreadsheet is empty.",true);return}
      var hd=rows[0].map(function(c){return String(c).trim().toLowerCase()});
      var find=function(re){return hd.findIndex(function(h){return re.test(h)})};
      var iFirst=find(/^(first|given|forename)/),iLast=find(/^(last|sur|family)/),iName=find(/^(full ?name|name|learner|student)/),iGroup=find(/^(group|class|cohort|course|set)/);

      pl.file=file.name;pl.header=header;S.pending=pl;render();
    }catch(e){toast("That file could not be read. Use an .xlsx or .csv file with names in the first column.",true)}
  };
  fr.readAsArrayBuffer(file);
}

/* ---------- csv ---------- */
function parseCsv(t){
  var rows=[],r=[],c="",q=false;t=t.replace(/^﻿/,"");
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===","){r.push(c);c=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);c="";if(r.length>1||r[0]!=="")rows.push(r);r=[]}
    else c+=ch}
  if(c!==""||r.length){r.push(c);rows.push(r)}
  return rows;
}
function importHub(text){
  var rows=parseCsv(text);if(rows.length<2){toast("That file has no learner rows.",true);return}
  var hd=rows[0].map(function(x){return x.trim().toLowerCase()});
  var ix=function(k){return hd.findIndex(function(h){return h.indexOf(k)===0})};
  var iN=ix("learner"),iS=ix("presentations studied"),iV=ix("slides"),iQ=ix("quizzes"),iA=ix("quiz average"),iD=ix("activities done"),iT=ix("activities total"),iL=ix("last active");
  if(iN<0){toast("This does not look like a study hub CSV. It needs a Learner column.",true);return}
  var n=0,added=0,now=Date.now(),have={};S.learners.forEach(function(l){have[l.name.toLowerCase()]=l});
  rows.slice(1).forEach(function(r){
    var name=(r[iN]||"").trim();if(!name)return;
    var la=r[iL]?Date.parse(r[iL]):0;
    var hub={studied:+r[iS]||0,slides:+r[iV]||0,quizzes:+r[iQ]||0,avg:r[iA]===""||r[iA]==null?"":+r[iA],done:+r[iD]||0,total:+r[iT]||0,lastActive:la||0,at:now};
    var cur=have[name.toLowerCase()];
    if(cur){upd(cur.id,{hub:hub})}
    else{var l={id:genId(),name:name,hub:hub};S.learners.push(l);upd(l.id,{name:l.name,hub:l.hub});added++}
    n++;
  });
  toast("Imported "+n+" learners"+(added?" ("+added+" new)":"")+".");
}
async function exportCsv(){
  var head=["Learner","Group"].concat(UNITS.map(function(u){return"Unit "+u})).concat(actList().map(function(a){return"Activity: "+a.title})).concat(S.cfg.assessments.map(function(t){return"Assessment: "+t.title})).concat(["Target","Hub studied","Hub slides","Hub quizzes","Hub quiz avg %","Hub last active"]);
  var rows=S.learners.slice().sort(function(a,b){return a.name.localeCompare(b.name)}).map(function(l){
    return[l.name,l.group||""].concat(UNITS.map(function(u){return ST[unitSt(l,u)]})).concat(actList().map(function(a){return ST[actSt(l,a.id)]})).concat(S.cfg.assessments.map(function(t){var r=l.tests&&l.tests[t.id];return r&&r.score!=null&&r.score!==""?r.score+"/"+t.max+" ("+(testRes(l,t)==="pass"?"Pass":"Refer")+")":""})).concat([l.target||"",l.hub?l.hub.studied:"",l.hub?l.hub.slides:"",l.hub?l.hub.quizzes:"",l.hub?l.hub.avg:"",l.hub&&l.hub.lastActive?new Date(l.hub.lastActive).toISOString().slice(0,10):""])});
  var q=function(v){v=String(v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'};
  var blob=new Blob(["﻿"+[head].concat(rows).map(function(r){return r.map(q).join(",")}).join("\r\n")],{type:"text/csv"});
  if(!DL){toast("Downloads are not available in this view.",true);return}
  try{await DL.save({filename:"learner-progress-tracker.csv",data:blob})}catch(e){toast("The file was not saved.",true)}
}

document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="q"){S.q=t.value;render()}
  else if(t.id==="nd")S.draft.note=t.value;
  else if(t.id==="addTxt")S.draft.add=t.value;
});
document.addEventListener("change",function(ev){
  var t=ev.target,d=t.dataset;
  if(t.id==="gsel"){S.group=t.value;render();return}
  if(t.id==="xlf"&&t.files[0]){readSheet(t.files[0]);t.value="";return}
  if(t.id==="csvf"&&t.files[0]){var f=t.files[0];if(f.size>2e6){toast("That file is too large.",true);return}var r=new FileReader();r.onload=function(){importHub(String(r.result))};r.readAsText(f);t.value="";return}
  if(d.score){var p=d.score.split("|"),l=L(p[0]);if(!l)return;var v=t.value===""?"":Math.max(0,Number(t.value));var o={tests:{}};o.tests[p[1]]={score:v,date:Date.now()};l.tests=Object.assign({},l.tests);l.tests[p[1]]=o.tests[p[1]];render();upd(l.id,o);return}
  if(d.target){var l2=L(d.target);if(l2){l2.target=t.value.slice(0,500);upd(l2.id,{target:l2.target})}return}
  if(d.group!==undefined&&t.dataset.group){var l3=L(t.dataset.group);if(l3){l3.group=t.value.trim().slice(0,40);upd(l3.id,{group:l3.group})}return}
  if(d.name){var l4=L(d.name),nv=t.value.trim().slice(0,80);if(l4&&nv){l4.name=nv;upd(l4.id,{name:nv})}return}
});

/* ---------- start ---------- */
(async function(){

  const {
    data: { session }
  } = await sb.auth.getSession();

  if (!session) {
    window.location.href = "login.html";
    return;
  }

  S.ready = true;
  S.me = session.user.id;

  console.log("Logged in:", session.user.email);

  // Load config
  const { data: configData, error: configError } =
    await sb
      .from("config")
      .select("*")
      .eq("id", "main")
      .single();

  if (configError) {
    console.error("Config error:", configError);
  } else {
    S.cfg = {
      activities: configData.activities || [],
      assessments: configData.assessments || []
    };
  }

  // Load learners
  const { data: learnersData, error: learnersError } =
    await sb
      .from("learners")
      .select("*");
  if (learnersError) {
  console.error("Learners error:", learnersError);
} else {

  S.learners = (learnersData || []).map(function(l){
    return Object.assign({}, l, {
      group: l.learner_group || ""
    });
  });

  S.learnersReady = true;
}
  render();

})();


</script>
