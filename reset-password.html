<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    font-family:system-ui,sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    padding:30px;
    border-radius:12px;
    width:320px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

input{
    width:100%;
    padding:10px;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:10px;
    background:#0f6b5c;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
</style>

</head>
<body>

<div class="card">

    <h2>Reset Password</h2>

    <input
        id="password"
        type="password"
        placeholder="New Password">

    <button onclick="updatePassword()">
        Save Password
    </button>

    <p id="msg"></p>

</div>

<script>

const sb = window.supabase.createClient(
    "https://aynyitslikigfbwacxnt.supabase.co",
    "sb_publishable_HvPDMaM4cZ3L-LwqUAOnRw_7Q7efv7H"
);

async function updatePassword(){

    const password =
        document.getElementById("password").value;

    const { error } =
        await sb.auth.updateUser({
            password: password
        });

    if(error){
        document.getElementById("msg").textContent =
            error.message;
        return;
    }

    document.getElementById("msg").textContent =
        "Password updated.";

    setTimeout(function(){
        window.location.href = "/login.html";
    }, 1500);
}

</script>

</body>
</html>
